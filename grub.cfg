# ===================================================================
# WBOOT MANAGER
# ===================================================================

set default=0
set timeout=-1
set pager=1
set gfxmode=1024x768
set gfxpayload=keep

export isoscan_target
export wboot_iso_path
export iso_path
export iso_filepath

insmod all_video
insmod efi_gop
insmod gfxterm
insmod font
insmod png
insmod jpeg
insmod part_gpt
insmod part_msdos
insmod fat
insmod ntfs
# NOT: exfat/udf/btrfs/xfs modulleri bazi GRUB kurulumlarinda
# (ozellikle minimal/varsayilan derlemelerde) mevcut olmayabilir,
# bu durumda "file not found" uyarisi basar ama script durmaz.
# Ortamina gore x86_64-efi/*.mod dosyalarinin var oldugundan emin ol.
insmod exfat
insmod udf
insmod btrfs
insmod xfs
insmod iso9660
insmod loopback
insmod regexp
insmod search
insmod linux
insmod chain
insmod configfile
insmod normal
insmod gzio
insmod echo
insmod true
insmod cat
insmod ls
insmod read
insmod test
insmod isoscan
insmod wimboot

search --set=root --file /EFI/Wboot/Wboot.efi
if [ -z "$root" ]; then
    echo "HATA: Wboot.efi bulunamadi!"
    echo "Alternatif dizinler araniyor..."
    search --set=root --file /EFI/BOOT/BOOTX64.EFI
    if [ -z "$root" ]; then
        echo "Kok dizin bulunamadi! Varsayilan (hd0) kullaniliyor..."
        sleep 3
        set root=(hd0)
    fi
fi

set prefix=($root)/EFI/Wboot
export prefix

terminal_output gfxterm
if [ -f $prefix/fonts/unicode.pf2 ]; then
    loadfont $prefix/fonts/unicode.pf2
fi

if [ -f $prefix/themes/wboot/theme.txt ]; then
    set theme=$prefix/themes/wboot/theme.txt
    export theme
fi

if [ -n "$isoscan_target" ]; then
    set iso_path="$isoscan_target"
    export iso_path
elif [ -n "$wboot_iso_path" ]; then
    set iso_path="$wboot_iso_path"
    export iso_path
fi

if [ -n "$iso_path" ]; then
    echo ""
    echo "=========================================="
    echo "  WBOOT ISO BOOT (DINAMIK TARAMA)"
    echo "=========================================="
    echo "  Imaj: $iso_path"
    echo "=========================================="

    unset isoscan_target
    unset wboot_iso_path

    loopback -d loop
    true

    loopback loop "$iso_path"
    set _loopback_status=$?

    set iso_filepath="$iso_path"
    regexp -s iso_filepath '^\([^)]*\)(.*)$' "$iso_path"
    export iso_filepath

    echo "  Saf dosya yolu (iso-scan icin): $iso_filepath"

    if [ "$_loopback_status" = "0" ]; then
        echo "OK: Imaj basariyla mount edildi."
        echo ""
        echo "Dinamik boot yapisi taraniyor..."

        set _saved_iso_path="$iso_path"

        set iso_path="$iso_filepath"
        export iso_path

        if [ -f (loop)/boot/grub/loopback.cfg ]; then
            echo "-> Ic loopback.cfg bulundu, calistiriliyor..."
            set saved_root=$root
            set root=(loop)
            configfile (loop)/boot/grub/loopback.cfg
            set root=$saved_root
        fi

        if [ -f (loop)/boot/grub/grub.cfg ]; then
            echo "-> Ic GRUB konfigurasyonu bulundu, calistiriliyor..."
            set saved_root=$root
            set root=(loop)
            configfile (loop)/boot/grub/grub.cfg
            set root=$saved_root
        fi

        set iso_path="$_saved_iso_path"
        export iso_path

        set kfile=""
        set ifile=""
        set boot_type=""

        if [ -f (loop)/casper/vmlinuz.efi ]; then
            set kfile="(loop)/casper/vmlinuz.efi"
            set boot_type="casper"
        fi
        if [ -z "$kfile" ]; then
            if [ -f (loop)/casper/vmlinuz ]; then
                set kfile="(loop)/casper/vmlinuz"
                set boot_type="casper"
            fi
        fi

        if [ -z "$kfile" ]; then
            if [ -f (loop)/live/vmlinuz.efi ]; then
                set kfile="(loop)/live/vmlinuz.efi"
                set boot_type="live"
            fi
        fi
        if [ -z "$kfile" ]; then
            if [ -f (loop)/live/vmlinuz ]; then
                set kfile="(loop)/live/vmlinuz"
                set boot_type="live"
            fi
        fi

        if [ -z "$kfile" ]; then
            if [ -f (loop)/boot/vmlinuz.efi ]; then
                set kfile="(loop)/boot/vmlinuz.efi"
                set boot_type="boot"
            fi
        fi
        if [ -z "$kfile" ]; then
            if [ -f (loop)/boot/vmlinuz ]; then
                set kfile="(loop)/boot/vmlinuz"
                set boot_type="boot"
            fi
        fi

        if [ -f (loop)/casper/initrd.img ]; then
            set ifile="(loop)/casper/initrd.img"
        fi
        if [ -z "$ifile" ]; then
            if [ -f (loop)/casper/initrd.boot ]; then
                set ifile="(loop)/casper/initrd.boot"
            fi
        fi
        if [ -z "$ifile" ]; then
            if [ -f (loop)/casper/initrd.lz ]; then
                set ifile="(loop)/casper/initrd.lz"
            fi
        fi
        if [ -z "$ifile" ]; then
            if [ -f (loop)/casper/initrd ]; then
                set ifile="(loop)/casper/initrd"
            fi
        fi

        if [ -z "$ifile" ]; then
            if [ -f (loop)/live/initrd.img ]; then
                set ifile="(loop)/live/initrd.img"
            fi
        fi
        if [ -z "$ifile" ]; then
            if [ -f (loop)/live/initrd ]; then
                set ifile="(loop)/live/initrd"
            fi
        fi

        if [ -z "$ifile" ]; then
            if [ -f (loop)/boot/initrd.img ]; then
                set ifile="(loop)/boot/initrd.img"
            fi
        fi
        if [ -z "$ifile" ]; then
            if [ -f (loop)/boot/initrd ]; then
                set ifile="(loop)/boot/initrd"
            fi
        fi

        if [ -n "$kfile" ]; then
            if [ -n "$ifile" ]; then
                echo "-> Manuel Kernel ve Initrd eslesti."
                echo "  Kernel: $kfile"
                echo "  Initrd: $ifile"
                echo "  Boot tipi: $boot_type"

                if [ "$boot_type" = "casper" ]; then
                    linux $kfile boot=casper iso-scan/filename="$iso_filepath" quiet splash ---
                    initrd $ifile
                    boot
                fi

                if [ "$boot_type" = "live" ]; then
                    linux $kfile boot=live findiso="$iso_filepath" quiet splash
                    initrd $ifile
                    boot
                fi

                if [ "$boot_type" = "boot" ]; then
                    linux $kfile iso-scan/filename="$iso_filepath" quiet
                    initrd $ifile
                    boot
                fi
            fi
        fi

        if [ -f (loop)/sources/boot.wim ]; then
            echo "-> Windows PE (WIM) tespit edildi."

            set wim_ok=1

            if [ ! -f (loop)/Boot/BCD ]; then
                set wim_ok=0
                echo "UYARI: Boot/BCD bulunamadi"
            fi

            if [ ! -f (loop)/Boot/boot.sdi ]; then
                set wim_ok=0
                echo "UYARI: Boot/boot.sdi bulunamadi"
            fi

            if [ "$wim_ok" = "1" ]; then
                echo "-> WIM boot baslatiliyor..."
                wimboot @:BCD:(loop)/Boot/BCD @:boot.sdi:(loop)/Boot/boot.sdi @:bootmgfw.efi:(loop)/EFI/Microsoft/Boot/bootmgfw.efi @:boot.wim:(loop)/sources/boot.wim
                boot
            else
                echo "UYARI: WIM boot icin gerekli dosyalar eksik!"
                echo "Devam etmek icin bir tusa basin..."
                read dummy
            fi
        fi

        echo ""
        echo "HATA: ISO icinde boot edilebilir yapi bulunamadi!"
        echo ""
        echo "Kok Dizin icerigi:"
        ls (loop)/
        echo ""
        echo "Devam etmek icin bir tusa basin..."
        read dummy
        loopback -d loop
        true
        configfile $prefix/grub.cfg

    else
        echo ""
        echo "HATA: $iso_path mount edilemedi!"
        echo "Hata kodu: $_loopback_status"
        echo ""
        echo "Devam etmek icin bir tusa basin..."
        read dummy
        configfile $prefix/grub.cfg
    fi

else
    clear
    echo "=========================================="
    echo "  WBOOT MANAGER v3.3"
    echo "  Multi Boot Manager"
    echo "=========================================="
    echo ""

    menuentry "[WBOOT] Ana Menu v3.3" --class title {
        echo "Wboot Manager v3.3"
        echo ""
        echo "Bu bir bilgi ekranidir, boot etmez."
        echo "Devam etmek icin bir tusa basin..."
        read dummy
        configfile $prefix/grub.cfg
    }

    set win_efi=""
    set linux_root=""
    set linux_root2=""
    set linux_root3=""

    search --no-floppy --file --set=win_efi /EFI/Microsoft/Boot/bootmgfw.efi
    search --no-floppy --file --set=linux_root /boot/grub/grub.cfg
    search --no-floppy --file --set=linux_root2 /grub/grub.cfg
    search --no-floppy --file --set=linux_root3 /boot/grub2/grub.cfg

    # --- KURULU ISLETIM SISTEMLERI (duz menu, submenu YOK) ---
    if [ -n "$win_efi" ]; then
        menuentry "Windows Boot Manager" --class windows {
            echo "Windows baslatiliyor..."
            set root=$win_efi
            chainloader /EFI/Microsoft/Boot/bootmgfw.efi
            boot
        }
    fi

    if [ -n "$linux_root" ]; then
        menuentry "Linux (GRUB) [1]" --class linux {
            echo "Linux GRUB yukleniyor..."
            set root=$linux_root
            configfile /boot/grub/grub.cfg
        }
    fi

    if [ -n "$linux_root2" ]; then
        menuentry "Linux (GRUB) [2]" --class linux {
            echo "Linux GRUB yukleniyor..."
            set root=$linux_root2
            configfile /grub/grub.cfg
        }
    fi

    if [ -n "$linux_root3" ]; then
        menuentry "Linux (GRUB2) [3]" --class linux {
            echo "Linux GRUB yukleniyor..."
            set root=$linux_root3
            configfile /boot/grub2/grub.cfg
        }
    fi

    if [ -z "$win_efi" ]; then
        if [ -z "$linux_root" ]; then
            if [ -z "$linux_root2" ]; then
                if [ -z "$linux_root3" ]; then
                    menuentry "Isletim sistemi bulunamadi" --class error {
                        echo "Diskte taninan isletim sistemi yok."
                        echo ""
                        echo "Mevcut diskler:"
                        ls
                        echo ""
                        echo "Devam etmek icin bir tusa basin..."
                        sleep 5
                    }
                fi
            fi
        fi
    fi

    # --- ISO ARACLARI (duz menu, submenu YOK) ---
    menuentry "Manuel ISO Yolu Gir" --class advanced {
        echo ""
        echo "=========================================="
        echo "  MANUEL ISO YOLU GIRIS"
        echo "=========================================="
        echo ""
        echo "ISO dosyasinin tam yolunu girin:"
        echo "Ornek: (hd0,msdos1)/ISO/ubuntu.iso"
        echo "Ornek: (hd0,gpt2)/ISO/pop-os.iso"
        echo ""
        echo "Yol: "
        read manual_iso

        if [ -n "$manual_iso" ]; then
            set _security_check=""
            regexp -s _security_check '(\.\.)' "$manual_iso"
            if [ -n "$_security_check" ]; then
                echo ""
                echo "GUVENLIK: '..' karakterleri tespit edildi!"
                echo "Bu giris engellendi."
                sleep 3
            else
                set wboot_iso_path="$manual_iso"
                export wboot_iso_path
                configfile $prefix/grub.cfg
            fi
        else
            echo "Gecersiz giris!"
            sleep 2
            configfile $prefix/grub.cfg
        fi
    }

    menuentry "ISO'lari Yeniden Tara" --class refresh {
        echo "ISO'lar yeniden taraniyor..."
        isoscan --progress --all-images
        export isoscan_count
        echo "$isoscan_count ISO bulundu."
        sleep 2
        configfile $prefix/grub.cfg
    }

    menuentry "ISO Debug Bilgisi" --class debug {
        echo "=========================================="
        echo "  ISO DEBUG BILGISI"
        echo "=========================================="
        echo ""
        echo "isoscan_count: $isoscan_count"
        echo "isoscan_target: $isoscan_target"
        echo "iso_path: $iso_path"
        echo ""
        echo "Mevcut diskler:"
        ls
        echo ""
        echo "Devam etmek icin bir tusa basin..."
        read dummy
        configfile $prefix/grub.cfg
    }

    # --- SISTEM ARACLARI (duz menu, submenu YOK) ---
    # NOT: "GRUB Komut Satiri" ogesi kaldirildi - 'normal' komutu
    # menu katmanlarinin ust uste binmesine (cift menu gorunumu)
    # sebep oluyordu ve bazi ortamlarda komut satirina hic girmiyordu.

    menuentry "Diskleri Listele" --class disk {
        echo "Mevcut diskler ve bolumler:"
        echo "=========================================="
        ls
        echo ""
        echo "Devam etmek icin bir tusa basin..."
        read dummy
        configfile $prefix/grub.cfg
    }

    menuentry "Menuyu Yenile" --class refresh {
        unset isoscan_target
        unset wboot_iso_path
        unset iso_path
        unset iso_filepath
        loopback -d loop
        true
        configfile $prefix/grub.cfg
    }

    menuentry "Yeniden Baslat" --class reboot {
        echo "Sistem yeniden baslatiliyor..."
        sleep 1
        reboot
    }

    menuentry "Kapat" --class halt {
        echo "Sistem kapatiliyor..."
        sleep 1
        halt
    }

    # ================================================================
    # ISO GIRDILERI (EN SONDA - listenin ALTINDA gorunmesi icin)
    # ================================================================
    # isoscan burada, TUM diger menuentry'lerden (Windows, Linux,
    # ISO Araclari, Sistem Araclari) SONRA cagriliyor. GRUB, menuentry
    # kayitlarini script'te tanimlandiklari sirayla listeler; bu
    # yuzden isoscan'i en sona koymak, ISO girdilerinin menunun EN
    # ALTINDA gorunmesini saglar. Tek cagri - cift menuentry olusmasin.
    echo ""
    echo "=========================================="
    echo "  ISO Kaynaklari Taraniyor..."
    echo "=========================================="
    isoscan --progress --all-images

    if [ -n "$isoscan_count" ]; then
        export isoscan_count
        if [ "$isoscan_count" -gt 0 ]; then
            echo "OK: $isoscan_count ISO dosyasi bulundu (listenin altinda)."
        else
            echo "UYARI: Hic ISO dosyasi bulunamadi."
        fi
    fi
fi

set fallback=normal